name: EAS Build
# Manual only — do not auto-run on every push (wastes Expo build quota).
# Trigger from Actions tab → EAS Build → Run workflow when you need a production Android AAB.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: pnpm

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        # --no-frozen-lockfile allows the brace-expansion override (5.0.5) to resolve
        # if the lockfile was generated before the pin was applied.
        run: pnpm install --no-frozen-lockfile

      - name: Build Android
        run: eas build --platform android --profile production --non-interactive
        env:
          EAS_SKIP_AUTO_FINGERPRINT: "1"
          EAS_BUILD_NO_EXPO_GO_WARNING: "true"
          EAS_NO_VCS: "1"

      - name: Submit to Google Play
        run: |
          if [ -n "$GOOGLE_SERVICE_ACCOUNT_KEY" ]; then
            echo "$GOOGLE_SERVICE_ACCOUNT_KEY" > ./google-service-account.json
            eas submit --platform android --profile production --latest --non-interactive
            rm -f ./google-service-account.json
          else
            echo "No Google service account key - skipping submission"
          fi
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}

name: EAS Build
on:
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  build:
    name: Build Android AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Android
        run: eas build --platform android --profile production --non-interactive
        env:
          EAS_SKIP_AUTO_FINGERPRINT: "1"
          EAS_BUILD_NO_EXPO_GO_WARNING: "true"
          EAS_NO_VCS: "1"

      - name: Submit to Google Play
        run: |
          if [ -n "$GOOGLE_SERVICE_ACCOUNT_KEY" ]; then
            echo "$GOOGLE_SERVICE_ACCOUNT_KEY" > ./google-service-account.json
            eas submit --platform android --profile production --latest --non-interactive
            rm -f ./google-service-account.json
          else
            echo "No Google service account key - skipping submission"
          fi
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}

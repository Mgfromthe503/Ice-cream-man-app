name: EAS Build
# Manual only — do not auto-run on every push (wastes Expo build quota).
# Trigger from Actions tab → EAS Build → Run workflow when you need a production Android AAB.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        required: false
        default: production
        type: choice
        options:
          - production
          - preview
          - production-apk
      submit:
        description: Submit to Google Play after build (AAB/production only)
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read

concurrency:
  group: eas-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android AAB
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_SKIP_AUTO_FINGERPRINT: "1"
      EAS_NO_VCS: "1"
      EAS_BUILD_NO_EXPO_GO_WARNING: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Node first so pnpm/action-setup uses the non-standalone install path
      # (avoids "Unable to locate executable file: pnpm" with setup-node cache).
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false

      - name: Configure pnpm store cache
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm

      - name: Verify pnpm on PATH
        run: |
          command -v pnpm
          pnpm --version

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Apply CJS interop patch + verify brace-expansion
        run: |
          if [ -f scripts/patch-brace-expansion-cjs.cjs ]; then
            node scripts/patch-brace-expansion-cjs.cjs
          fi
          node -e "
            const be = require('brace-expansion');
            const expand = typeof be === 'function' ? be : be && (be.default || be.expand);
            if (typeof expand !== 'function') {
              console.error('FAIL: brace-expansion has no callable default');
              process.exit(1);
            }
            const viaDefault = typeof be === 'function' ? be : be && be.default;
            if (typeof viaDefault !== 'function') {
              console.error('FAIL: brace-expansion.default is not a function (minimatch interop path)');
              process.exit(1);
            }
            console.log('OK: expand({a,b}) =>', expand('{a,b}'));
          "

      - name: Check EXPO_TOKEN
        id: token
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::warning::EXPO_TOKEN secret is not set. Skipping EAS build."
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Expo and EAS
        if: steps.token.outputs.has_token == 'true'
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android
        if: steps.token.outputs.has_token == 'true'
        run: |
          PROFILE="${{ github.event.inputs.profile || 'production' }}"
          eas build --platform android --profile "$PROFILE" --non-interactive --wait

      - name: Submit to Google Play
        if: >-
          steps.token.outputs.has_token == 'true' &&
          github.event.inputs.submit == 'true' &&
          (github.event.inputs.profile == 'production' || github.event.inputs.profile == '' || github.event.inputs.profile == null)
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
        run: |
          KEY_JSON="${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:-$GOOGLE_SERVICE_ACCOUNT_KEY}"
          if [ -z "$KEY_JSON" ]; then
            echo "No Google Play service account secret — skipping submit"
            exit 0
          fi
          umask 077
          KEYFILE=$(mktemp)
          printf '%s' "$KEY_JSON" > "$KEYFILE"
          eas submit --platform android --latest --non-interactive \
            --profile production \
            --service-account-json "$KEYFILE"
          rm -f "$KEYFILE"

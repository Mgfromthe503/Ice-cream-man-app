name: EAS Build
# Manual only — do not auto-run on every push (wastes Expo build quota).
# Trigger from Actions tab → EAS Build → Run workflow when you need a production Android AAB.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        required: false
        default: production
        type: choice
        options:
          - production
          - preview
          - production-apk
      submit:
        description: Submit to Google Play after build (AAB/production only)
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read

concurrency:
  group: eas-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android AAB
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_SKIP_AUTO_FINGERPRINT: "1"
      EAS_NO_VCS: "1"
      EAS_BUILD_NO_EXPO_GO_WARNING: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm

      - name: Verify pnpm overrides / lockfile config
        run: node scripts/verify-pnpm-overrides.cjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply CJS interop patch + verify brace-expansion
        run: |
          if [ -f scripts/patch-brace-expansion-cjs.cjs ]; then
            node scripts/patch-brace-expansion-cjs.cjs
          fi
          node scripts/verify-pnpm-overrides.cjs
          node -e "
            const be = require('brace-expansion');
            const expand = typeof be === 'function' ? be : be && (be.default || be.expand);
            if (typeof expand !== 'function') {
              console.error('FAIL: brace-expansion has no callable default');
              process.exit(1);
            }
            const viaDefault = typeof be === 'function' ? be : be && be.default;
            if (typeof viaDefault !== 'function') {
              console.error('FAIL: brace-expansion.default is not a function (minimatch interop path)');
              process.exit(1);
            }
            console.log('OK: expand({a,b}) =>', expand('{a,b}'));
          "

      - name: Verify Android Play release configuration
        run: pnpm verify:android-release

      - name: Check EXPO_TOKEN
        id: token
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::warning::EXPO_TOKEN secret is not set. Skipping EAS build."
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Expo and EAS
        if: steps.token.outputs.has_token == 'true'
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # Branch-only investigation step. It reads public credential identifiers and
      # certificate fingerprints, and deliberately does not download a keystore,
      # create a build, or submit to Google Play.
      - name: Audit EAS Android credential metadata
        if: steps.token.outputs.has_token == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_JKS_BASE64: ${{ secrets.KEYSTORE_JKS_BASE64 }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_JKS_BASE64: ${{ secrets.ANDROID_KEYSTORE_JKS_BASE64 }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          GOOGLE_PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.GOOGLE_PLAY_UPLOAD_KEYSTORE_BASE64 }}
          EAS_ANDROID_KEYSTORE_BASE64: ${{ secrets.EAS_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          node scripts/audit-eas-android-credential-metadata.cjs
          bash scripts/audit-github-android-keystore-secrets.sh

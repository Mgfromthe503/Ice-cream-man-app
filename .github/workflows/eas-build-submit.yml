name: CLEAN LAUNCH — EAS Android Release

# This workflow belongs to the clean-launch-track branch.
# It never targets the existing com.icecreamman.app Play project.
# It builds the new com.icecreamman.launch application only.
on:
  workflow_dispatch:
    inputs:
      submit:
        description: Submit the new AAB to Google Play after build
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read

concurrency:
  group: clean-launch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate clean launch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Android release configuration
        run: pnpm verify:android-release

      - name: Type check
        run: pnpm check

      - name: Run tests
        run: pnpm test

  build:
    name: Build clean Android AAB
    needs: validate
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
      EAS_SKIP_AUTO_FINGERPRINT: "1"
      EAS_NO_VCS: "1"
      EAS_BUILD_NO_EXPO_GO_WARNING: "true"
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Require fresh EAS project
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN is required." >&2
            exit 1
          fi
          if [ -z "$EAS_PROJECT_ID" ]; then
            echo "EAS_PROJECT_ID is required for the clean launch track." >&2
            echo "It must point to the NEW EAS project, never the existing production project." >&2
            exit 1
          fi

      - name: Setup Expo and EAS CLI
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Print clean release identity
        run: |
          echo "Package: com.icecreamman.launch"
          echo "EAS project: $EAS_PROJECT_ID"
          echo "Profile: production"
          echo "Artifact: Android App Bundle"

      - name: Build clean production AAB
        run: eas build --platform android --profile production --non-interactive --wait

      - name: Submit clean AAB to Google Play
        if: github.event.inputs.submit == 'true'
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is required for submission." >&2
            exit 1
          fi
          umask 077
          KEYFILE=$(mktemp)
          trap 'rm -f "$KEYFILE"' EXIT
          printf '%s' "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" > "$KEYFILE"
          eas submit --platform android --latest --non-interactive \
            --profile production \
            --service-account-json "$KEYFILE"

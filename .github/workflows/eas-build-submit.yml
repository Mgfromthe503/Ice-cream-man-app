name: EAS build and submit

on:
  push:
    branches:
      - main
    paths:
      - app.config.ts
      - eas.json
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/eas-build-submit.yml
  workflow_dispatch:
    inputs:
      submit:
        description: Submit the latest Android build to Google Play internal track
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate types
        run: pnpm check

      - name: Run tests
        run: pnpm test

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android app bundle
        run: eas build --platform android --profile production --non-interactive --wait

      - name: Submit latest Android build
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.submit == 'true' }}
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is required when submit=true" >&2
            exit 1
          fi

          umask 077
          printf '%s' "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" > /tmp/google-play.json
          eas submit --platform android --latest --non-interactive --service-account-json /tmp/google-play.json
          rm -f /tmp/google-play.json

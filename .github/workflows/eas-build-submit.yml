name: EAS Build and Submit

# Trigger matrix:
#   pull_request → validate only (type-check + tests give fast PR feedback)
#   push to main  → validate, then build Android bundle and auto-submit to Play internal track
#   workflow_dispatch → validate, then build; optionally submit with chosen profile
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile"
        required: false
        default: "production"
        type: choice
        options:
          - production
          - preview
      submit:
        description: "Submit to Google Play after build"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read

jobs:
  # ── Job 1: Validate ────────────────────────────────────────────────────────
  # Runs on every PR and every push so failures are clearly attributed to code
  # problems, not to Expo/EAS authentication or build issues.
  validate:
    name: Validate (type-check + tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate types
        run: pnpm check

      - name: Run tests
        run: pnpm test

  # ── Job 2: Build (and optionally submit) ───────────────────────────────────
  # Skipped on pull_request events so EAS build minutes are only spent on
  # validated code landing on main or explicit manual dispatches.
  build:
    name: EAS Android build
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android app bundle
        run: |
          PROFILE="${{ inputs.profile || 'production' }}"
          eas build --platform android --profile "$PROFILE" --non-interactive --wait

      # Auto-submit on every main push (internal track), or when workflow_dispatch
      # is triggered with submit=true.  If GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is
      # absent the step warns and exits cleanly rather than failing the build.
      - name: Submit to Google Play
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.submit == 'true')
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::warning::GOOGLE_PLAY_SERVICE_ACCOUNT_JSON secret is not set — skipping submission."
            exit 0
          fi
          umask 077
          printf '%s' "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" > /tmp/google-play.json
          eas submit --platform android --latest --non-interactive \
            --service-account-json /tmp/google-play.json
          rm -f /tmp/google-play.json

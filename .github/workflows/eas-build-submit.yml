final_integrated_yaml = """
name: EAS Build and Submit.yml

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile"
        required: false
        default: "production"
        type: choice
        options:
          - production
          - preview
          - production-apk
      submit:
        description: "Submit to Google Play after build (AAB/production only)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read

concurrency:
  group: eas-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Dependency audit
        continue-on-error: true
        run: pnpm audit --prod || true

      - name: Validate types
        run: pnpm check

      - name: Run tests
        run: pnpm test

  build:
    name: EAS Android build
    needs: validate
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Check EXPO_TOKEN
        id: token
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Expo and EAS CLI
        if: steps.token.outputs.has_token == 'true'
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android app
        if: steps.token.outputs.has_token == 'true'
        run: |
          PROFILE="${{ inputs.profile || 'production' }}"
          eas build --platform android --profile "$PROFILE" --non-interactive --wait

      - name: Submit to Google Play
        if: >-
          steps.token.outputs.has_token == 'true' &&
          inputs.submit == 'true' &&
          (inputs.profile == 'production' || inputs.profile == '')
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]; then
            exit 0
          fi
          umask 077
          KEYFILE=$(mktemp)
          printf '%s' "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" > "$KEYFILE"
          eas submit --platform android --latest --non-interactive \\
            --profile production \\
            --service-account-json "$KEYFILE"
          rm -f "$KEYFILE"
"""
print(final_integrated_yaml)

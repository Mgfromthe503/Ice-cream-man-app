name: EAS Production Android Release

# One production path for the existing Google Play application.
# Validation runs on pull requests/pushes; the actual EAS AAB build and
# optional Google Play submission are manual to avoid consuming build quota.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      submit:
        description: Submit the production AAB to Google Play after build
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read

concurrency:
  group: eas-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate production source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm

      - name: Verify pnpm overrides / lockfile config
        run: node scripts/verify-pnpm-overrides.cjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply CJS interop patch + verify brace-expansion
        run: |
          if [ -f scripts/patch-brace-expansion-cjs.cjs ]; then
            node scripts/patch-brace-expansion-cjs.cjs
          fi
          node scripts/verify-pnpm-overrides.cjs
          node -e "
            const be = require('brace-expansion');
            const expand = typeof be === 'function' ? be : be && (be.default || be.expand);
            if (typeof expand !== 'function') process.exit(1);
            const viaDefault = typeof be === 'function' ? be : be && be.default;
            if (typeof viaDefault !== 'function') process.exit(1);
            console.log('OK: brace-expansion');
          "

      - name: Verify Android Play release configuration
        run: pnpm verify:android-release

      - name: Validate types
        run: pnpm check

      - name: Run tests
        run: pnpm test

  build:
    name: Build production Android AAB
    needs: validate
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_SKIP_AUTO_FINGERPRINT: "1"
      EAS_NO_VCS: "1"
      EAS_BUILD_NO_EXPO_GO_WARNING: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm

      - name: Verify pnpm overrides / lockfile config
        run: node scripts/verify-pnpm-overrides.cjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Require EAS token
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN is required for the production EAS build." >&2
            exit 1
          fi

      - name: Setup Expo and EAS CLI
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build production AAB
        run: eas build --platform android --profile production --non-interactive --wait

      - name: Submit production AAB to Google Play
        if: github.event.inputs.submit == 'true'
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is required when submission is requested." >&2
            exit 1
          fi
          umask 077
          KEYFILE=$(mktemp)
          trap 'rm -f "$KEYFILE"' EXIT
          printf '%s' "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" > "$KEYFILE"
          eas submit --platform android --latest --non-interactive \
            --profile production \
            --service-account-json "$KEYFILE"

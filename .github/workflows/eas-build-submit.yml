name: EAS Production Android Release

# One production path for the existing Google Play application.
# Validation runs on pull requests/pushes; the actual EAS AAB build and
# optional Google Play submission are manual to avoid consuming build quota.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      submit:
        description: Submit the production AAB to Google Play after build
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read

concurrency:
  group: eas-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate production source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm

      - name: Verify pnpm overrides / lockfile config
        run: node scripts/verify-pnpm-overrides.cjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply CJS interop patch + verify brace-expansion
        run: |
          if [ -f scripts/patch-brace-expansion-cjs.cjs ]; then
            node scripts/patch-brace-expansion-cjs.cjs
          fi
          node scripts/verify-pnpm-overrides.cjs
          node -e "
            const be = require('brace-expansion');
            const expand = typeof be === 'function' ? be : be && (be.default || be.expand);
            if (typeof expand !== 'function') process.exit(1);
            const viaDefault = typeof be === 'function' ? be : be && be.default;
            if (typeof viaDefault !== 'function') process.exit(1);
            console.log('OK: brace-expansion');
          "

      - name: Verify Android Play release configuration
        run: pnpm verify:android-release

      - name: Validate types
        run: pnpm check

      - name: Run tests
        run: pnpm test

  build:
    name: Build production Android AAB
    needs: validate
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN || secrets.EXPOTOKEN }}
      EAS_SKIP_AUTO_FINGERPRINT: "1"
      EAS_NO_VCS: "1"
      EAS_BUILD_NO_EXPO_GO_WARNING: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm

      - name: Verify pnpm overrides / lockfile config
        run: node scripts/verify-pnpm-overrides.cjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Require EAS token
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN or EXPOTOKEN is required for the production EAS build." >&2
            exit 1
          fi

      - name: Setup Expo and EAS CLI
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN || secrets.EXPOTOKEN }}

      - name: Verify EAS and Google Play signing
        run: pnpm verify:play-signing

      - name: Build production AAB
        id: eas_build
        run: |
          set -euo pipefail
          eas build --platform android --profile production --non-interactive --wait --json > eas-build.json
          node scripts/export-eas-build-metadata.cjs eas-build.json >> "$GITHUB_OUTPUT"

      - name: Submit production AAB and upload R8 mapping
        if: github.event.inputs.submit == 'true'
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLEPLAYSERVICEACCOUNT || secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON || secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          EAS_BUILD_ID: ${{ steps.eas_build.outputs.build_id }}
          ANDROID_VERSION_CODE: ${{ steps.eas_build.outputs.version_code }}
          EAS_BUILD_ARTIFACTS_URL: ${{ steps.eas_build.outputs.build_artifacts_url }}
        run: |
          set -euo pipefail
          if [ -z "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "GOOGLEPLAYSERVICEACCOUNT or GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is required when submission is requested." >&2
            exit 1
          fi
          if [ -z "$EAS_BUILD_ID" ] || [ -z "$ANDROID_VERSION_CODE" ] || [ -z "$EAS_BUILD_ARTIFACTS_URL" ]; then
            echo "The completed EAS build metadata is incomplete." >&2
            exit 1
          fi

          umask 077
          KEYFILE="google-service-account.json"
          ARTIFACT_ARCHIVE="$(mktemp)"
          MAPPING_FILE="$(mktemp --suffix=.txt)"
          trap 'rm -f "$KEYFILE" "$ARTIFACT_ARCHIVE" "$MAPPING_FILE"' EXIT
          printf '%s' "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" > "$KEYFILE"

          eas submit --platform android --id "$EAS_BUILD_ID" --non-interactive --wait --profile production

          curl --fail --location --silent --show-error "$EAS_BUILD_ARTIFACTS_URL" --output "$ARTIFACT_ARCHIVE"
          MAPPING_ENTRY="$(unzip -Z1 "$ARTIFACT_ARCHIVE" | grep -E '(^|/)mapping\.txt$' | head -n 1 || true)"
          if [ -z "$MAPPING_ENTRY" ]; then
            echo "The EAS build-artifacts archive does not contain mapping.txt." >&2
            exit 1
          fi
          unzip -p "$ARTIFACT_ARCHIVE" "$MAPPING_ENTRY" > "$MAPPING_FILE"
          if [ ! -s "$MAPPING_FILE" ]; then
            echo "The extracted R8 mapping file is empty." >&2
            exit 1
          fi

          node scripts/upload-play-deobfuscation.cjs \
            --keyfile "$KEYFILE" \
            --version-code "$ANDROID_VERSION_CODE" \
            --mapping-file "$MAPPING_FILE"

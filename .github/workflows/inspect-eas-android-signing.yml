name: Inspect EAS Android Signing

on:
  push:
    branches:
      - chore/inspect-eas-android-keystore

permissions:
  contents: read

jobs:
  inspect-current-and-historical-projects:
    name: Inspect current and historical Android signing fingerprints
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Compare credential fingerprints without exposing secret material
        shell: bash
        run: |
          node <<'NODE'
          const expected = '8961BC4053C121FFA41F584698A5C5114B9B2EBF';
          const query = `
            query AndroidCredentialLineage {
              app {
                current: byId(appId: "5bf9c92f-2974-422e-b6cb-958d6f7ae469") {
                  id
                  currentCredentials: androidAppCredentials(filter: {
                    applicationIdentifier: "com.icecreamman.app"
                    legacyOnly: false
                  }) {
                    isLegacy
                    androidAppBuildCredentialsList {
                      name
                      isDefault
                      isLegacy
                      androidKeystore {
                        id
                        keyAlias
                        sha1CertificateFingerprint
                        createdAt
                        updatedAt
                      }
                    }
                  }
                  legacyCredentials: androidAppCredentials(filter: {
                    applicationIdentifier: "com.icecreamman.app"
                    legacyOnly: true
                  }) {
                    isLegacy
                    androidAppBuildCredentialsList {
                      name
                      isDefault
                      isLegacy
                      androidKeystore {
                        id
                        keyAlias
                        sha1CertificateFingerprint
                        createdAt
                        updatedAt
                      }
                    }
                  }
                }
                historical: byId(appId: "a7392ba6-c4a2-455d-b03c-9bc0233b7b12") {
                  id
                  currentCredentials: androidAppCredentials(filter: {
                    applicationIdentifier: "com.icecreamman.app"
                    legacyOnly: false
                  }) {
                    isLegacy
                    androidAppBuildCredentialsList {
                      name
                      isDefault
                      isLegacy
                      androidKeystore {
                        id
                        keyAlias
                        sha1CertificateFingerprint
                        createdAt
                        updatedAt
                      }
                    }
                  }
                  legacyCredentials: androidAppCredentials(filter: {
                    applicationIdentifier: "com.icecreamman.app"
                    legacyOnly: true
                  }) {
                    isLegacy
                    androidAppBuildCredentialsList {
                      name
                      isDefault
                      isLegacy
                      androidKeystore {
                        id
                        keyAlias
                        sha1CertificateFingerprint
                        createdAt
                        updatedAt
                      }
                    }
                  }
                }
              }
            }
          `;
          const response = await fetch('https://api.expo.dev/graphql', {
            method: 'POST',
            headers: {
              authorization: `Bearer ${process.env.EXPO_TOKEN}`,
              'content-type': 'application/json',
            },
            body: JSON.stringify({ query }),
          });
          const body = await response.json();
          if (!response.ok || body.errors?.length) {
            throw new Error(`Expo credential audit failed: ${JSON.stringify(body.errors ?? body)}`);
          }
          let matched = false;
          for (const [projectLabel, project] of Object.entries(body.data?.app ?? {})) {
            console.log(`Project: ${projectLabel} (${project?.id ?? 'not found'})`);
            for (const [recordLabel, records] of [
              ['current', project?.currentCredentials ?? []],
              ['legacy', project?.legacyCredentials ?? []],
            ]) {
              for (const record of records) {
                for (const credential of record.androidAppBuildCredentialsList ?? []) {
                  const store = credential.androidKeystore;
                  const sha1 = store?.sha1CertificateFingerprint ?? 'none';
                  console.log(`${projectLabel}/${recordLabel}: profile=${credential.name}; default=${credential.isDefault}; SHA-1=${sha1}; updated=${store?.updatedAt ?? 'none'}`);
                  if (sha1.replace(/:/g, '').toUpperCase() === expected) {
                    console.log(`MATCH FOUND: ${projectLabel}/${recordLabel} contains the Google Play-required upload key.`);
                    matched = true;
                  }
                }
              }
            }
          }
          if (!matched) console.log('No managed Expo credential matches the Google Play-required SHA-1.');
          NODE

# Appknox mobile SAST — non-blocking for Expo/React Native (no local gradlew).
# Requires APPKNOX_ACCESS_TOKEN secret and an APK/AAB artifact path when enabled.
# For production Play Store path, prefer EAS Build + Play Console internal testing.

name: Appknox

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  appknox:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Skip native Appknox on Expo project
        run: |
          echo "::notice::Ice Cream Man is an Expo/React Native app. There is no root gradlew."
          echo "Use EAS Build (production profile) for AAB, then optional Appknox scan of the EAS artifact."
          echo "This job is intentionally non-blocking so push CI stays green."

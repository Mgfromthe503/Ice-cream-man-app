name: Audit EAS Android Credential Lineage

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Read public Android credential metadata
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Require Expo token
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN is required for this read-only metadata audit." >&2
            exit 1
          fi

      - name: Query Android credential fingerprints without secret material
        shell: bash
        run: |
          set -euo pipefail
          read -r -d '' QUERY <<'GRAPHQL' || true
          query AndroidCredentialMetadata {
            app {
              byFullName(fullName: "@mgfromthe503/the-ice-cream-man-app") {
                id
                androidAppCredentials(filter: {
                  applicationIdentifier: "com.icecreamman.app"
                  legacyOnly: false
                }) {
                  id
                  applicationIdentifier
                  isLegacy
                  androidAppBuildCredentialsList {
                    id
                    name
                    isDefault
                    isLegacy
                    androidKeystore {
                      id
                      type
                      keyAlias
                      md5CertificateFingerprint
                      sha1CertificateFingerprint
                      sha256CertificateFingerprint
                      createdAt
                      updatedAt
                    }
                  }
                }
              }
            }
          }
          GRAPHQL

          payload=$(jq -cn --arg query "$QUERY" '{query: $query}')
          response=$(curl --fail --silent --show-error \
            --request POST https://api.expo.dev/graphql \
            --header "Authorization: Bearer $EXPO_TOKEN" \
            --header "Content-Type: application/json" \
            --data "$payload")

          if jq -e '.errors | length > 0' >/dev/null <<<"$response"; then
            jq '.errors' <<<"$response"
            exit 1
          fi

          # The query deliberately excludes keystore bytes, passwords, token values,
          # and all Google service-account material. Emit only identifiers and public
          # certificate fingerprints needed for signing-lineage verification.
          jq '{
            appId: .data.app.byFullName.id,
            credentials: [.data.app.byFullName.androidAppCredentials[] | {
              id,
              applicationIdentifier,
              isLegacy,
              buildCredentials: [.androidAppBuildCredentialsList[] | {
                id,
                name,
                isDefault,
                isLegacy,
                keystore: (.androidKeystore | {
                  id,
                  type,
                  keyAlias,
                  md5CertificateFingerprint,
                  sha1CertificateFingerprint,
                  sha256CertificateFingerprint,
                  createdAt,
                  updatedAt
                })
              }]
            }]
          }' <<<"$response"

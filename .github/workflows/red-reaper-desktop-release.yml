name: Build Red Reaper AI Windows Installer

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "GitHub release tag to create when publish_release is enabled (for example v0.1.0)"
        required: false
        type: string
        default: "v0.1.0"
      publish_release:
        description: "Create a public GitHub Release and upload the installer"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build_windows_installer:
    name: Build Windows installer
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/red-reaper-desktop
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/red-reaper-desktop/pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install desktop dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate the desktop interface
        run: pnpm check

      - name: Build NSIS installer
        run: pnpm tauri build --bundles nsis

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: red-reaper-ai-windows-installer
          path: apps/red-reaper-desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  publish_release:
    name: Publish GitHub release
    if: inputs.publish_release
    needs: build_windows_installer
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows installer artifact
        uses: actions/download-artifact@v4
        with:
          name: red-reaper-ai-windows-installer
          path: release-assets

      - name: Create public release and upload installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release create $env:RELEASE_TAG release-assets/*.exe --repo $env:GITHUB_REPOSITORY --title "Red Reaper AI $env:RELEASE_TAG" --generate-notes

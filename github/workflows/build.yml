# Note: This is a representation of what your .github/workflows/build.yml should look like.
# You should copy the content below into your repository file.

workflow_content = """
name: Expo EAS Build
on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name:  Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22 # Updated to avoid deprecation
          cache: 'pnpm'

      - name:  Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name:  Install dependencies
        run: pnpm install

      - name:  Build App
        run: eas build --platform android --profile production --non-interactive
"""
print("Workflow template updated. Ensure EXPO_TOKEN is set in your GitHub Repository Secrets.")

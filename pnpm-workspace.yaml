# Monorepo workspace. The existing Expo app lives at the repository root;
# Red Reaper AI is isolated in apps/red-reaper-desktop so its desktop toolchain
# does not alter the mobile application's runtime contract.
packages:
  - "."
  - "apps/*"
  - "packages/*"
# pnpm 9.12.0 is pinned for EAS and resolves overrides from package.json
# "pnpm.overrides". Keep this file free of an `overrides:` block until the
# project intentionally upgrades its package-manager contract.

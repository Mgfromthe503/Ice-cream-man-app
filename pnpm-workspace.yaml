# Monorepo workspace — The Ice Cream Man
# Primary app + server live at the repo root (single package).
# packages/* is reserved for future shared libraries (e.g. types, UI).
packages:
  - "."
  - "packages/*"
# Do NOT add an `overrides:` key here. pnpm only reads overrides from this file
# from v10 onwards; this repo builds on pnpm 9.12.0 (package.json packageManager
# and eas.json build.base.pnpm), which ignores it silently and drops every
# security pin. Overrides live in package.json "pnpm.overrides" and are enforced
# by `pnpm verify:deps`.

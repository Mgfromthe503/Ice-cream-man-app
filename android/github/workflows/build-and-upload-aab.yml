name: EAS build and submit

on: push: branches: - fix/play-billing-6-0-1 workflow_dispatch: {}

permissions: contents: read

jobs: build-and-submit: runs-on: ubuntu-latest

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Set up Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 18

  - name: Install pnpm
    run: npm install -g pnpm

  - name: Install dependencies
    run: pnpm install

  - name: Install EAS CLI
    run: npm install -g eas-cli

  - name: Login to EAS
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    run: |
      echo "Logging into EAS"
      eas whoami || eas login --token $EXPO_TOKEN

  - name: Build Android AAB with EAS
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    run: |
      eas build -p android --profile production --non-interactive

  - name: Prepare Google Play service account JSON
    if: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
    run: |
      echo "Writing service account JSON to file"
      printf "%s" "${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}" > /tmp/google-play.json

  - name: Submit last Android build to Google Play
    if: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    run: |
      echo "Submitting latest build to Google Play (internal)"
      eas submit --platform android --latest --non-interactive --service-account-json /tmp/google-play.json
